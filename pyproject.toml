[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-transcribe"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "lancedb>=0.6",
    "sentence-transformers>=2.7",
    "pandas>=2.0",
    "rich>=13.0",
    "deepgram-sdk>=7.2.0",
    "python-dotenv>=1.2.2",
    "anthropic>=0.40.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
voice = "voice_transcribe.voice:main"
voice-index = "voice_transcribe.index_cmd:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
